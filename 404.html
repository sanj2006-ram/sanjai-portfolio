<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>404 - Section Not Found | Sanjai Ram M</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --sans: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      --mono: 'JetBrains Mono', monospace;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: var(--sans);
      background-color: #F8FAFC;
      color: #0F172A;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      -webkit-font-smoothing: antialiased;
    }
    .error-card {
      background: #FFFFFF;
      border: 1px solid #E2E8F0;
      border-radius: 24px;
      padding: 44px 28px;
      max-width: 520px;
      width: 100%;
      text-align: center;
      box-shadow: 0 20px 50px -10px rgba(15, 23, 42, 0.08), 0 4px 16px rgba(15, 23, 42, 0.03);
    }
    .error-badge-icon {
      width: 72px;
      height: 72px;
      margin: 0 auto 18px;
      border-radius: 22px;
      background: #0F172A;
      color: #FFFFFF;
      font-family: var(--mono);
      font-size: 26px;
      font-weight: 800;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 12px 30px rgba(15, 23, 42, 0.18);
    }
    .status-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 12px;
      border-radius: 100px;
      background: #FEF2F2;
      border: 1px solid #FEE2E2;
      color: #B91C1C;
      font-family: var(--mono);
      font-size: 11px;
      font-weight: 700;
      margin-bottom: 16px;
    }
    .status-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #EF4444;
      box-shadow: 0 0 6px #EF4444;
    }
    h1 {
      font-size: 26px;
      font-weight: 800;
      letter-spacing: -0.02em;
      color: #0F172A;
      margin-bottom: 10px;
    }
    p {
      font-size: 14px;
      color: #475569;
      line-height: 1.6;
      margin-bottom: 28px;
    }
    .btn-group {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: center;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 20px;
      border-radius: 100px;
      font-size: 13px;
      font-weight: 600;
      text-decoration: none;
      cursor: pointer;
      transition: all 180ms ease;
    }
    .btn-primary {
      background: #0F172A;
      color: #FFFFFF;
      border: 1px solid #0F172A;
      box-shadow: 0 4px 12px rgba(15, 23, 42, 0.15);
    }
    .btn-primary:hover {
      background: #1E293B;
      transform: translateY(-1px);
    }
    .btn-secondary {
      background: #FFFFFF;
      color: #0F172A;
      border: 1px solid #CBD5E1;
    }
    .btn-secondary:hover {
      background: #F8FAFC;
      border-color: #94A3B8;
    }
  </style>
</head>
<body>
  <div class="error-card">
    <div class="error-badge-icon">404</div>
    <div class="status-pill">
      <span class="status-dot"></span>
      <span>HTTP 404 &middot; SECTION NOT FOUND</span>
    </div>
    <h1>Oops! Section Not Found</h1>
    <p>The route or file you're trying to view doesn't exist in Sanjai Ram's portfolio. You can easily head back home or jump into one of the main sections below.</p>
    <div class="btn-group">
      <a href="index.html#overview" class="btn btn-primary">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
        <span>Back to Overview</span>
      </a>
      <a href="index.html#dashboard" class="btn btn-secondary">BI Dashboard</a>
      <a href="index.html#projects" class="btn btn-secondary">Projects</a>
      <a href="index.html#resume" class="btn btn-secondary">Resume</a>
    </div>
  </div>
</body>
</html>
