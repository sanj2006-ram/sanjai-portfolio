      justify-content: center;

      font-size: 13px;
      font-weight: 600;
      text-decoration: none;
      cursor: pointer;
      transition: transform 120ms ease, background-color 120ms ease, border-color 120ms ease;

      background: #7A2238;
      color: #FFFFFF;
      border: 1px solid #7A2238;
      box-shadow: 0 4px 14px rgba(122, 34, 56, 0.25);

    .btn-primary:hover {
      background: #912C44;
      border-color: #912C44;

      background: #FFFFFF;
