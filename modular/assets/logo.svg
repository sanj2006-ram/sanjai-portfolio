<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="gold-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FACC15"/>
      <stop offset="100%" stop-color="#EAB308"/>
    </linearGradient>
    <linearGradient id="tile-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
  </defs>
  <!-- Background Tile -->
  <rect width="64" height="64" rx="16" fill="url(#tile-bg)"/>
  <rect x="1" y="1" width="62" height="62" rx="15" fill="none" stroke="url(#gold-grad)" stroke-width="1.75" stroke-opacity="0.85"/>
  
  <!-- Monogram S & R -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- Stylized 'S' in Crisp White -->
    <path d="M 27 20 C 20 20, 16 23, 16 28 C 16 34, 28 33, 28 39 C 28 44, 22 45, 17 44" stroke="#FFFFFF" stroke-width="4.5"/>
    
    <!-- Stylized 'R' in Power BI Gold Amber -->
    <path d="M 33 20 L 33 44" stroke="url(#gold-grad)" stroke-width="4.5"/>
    <path d="M 33 20 L 44 20 C 49 20, 50 24, 50 28 C 50 32, 47 34, 42 34 L 33 34" stroke="url(#gold-grad)" stroke-width="4.5"/>
    <path d="M 41 34 L 50 44" stroke="url(#gold-grad)" stroke-width="4.5"/>
    
    <!-- Power BI / Analytics Data Metric Node -->
    <circle cx="51" cy="20" r="3" fill="#FACC15"/>
  </g>
</svg>
