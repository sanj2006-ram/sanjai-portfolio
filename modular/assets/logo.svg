<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 44" width="200" height="44" fill="none">
  <defs>
    <style>
      .nl-navy { fill: #0A1624; }
      .nl-orange { fill: #DE4B00; }
      .nl-sanjai {
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter", sans-serif;
        font-size: 16.5px;
        font-weight: 850;
        letter-spacing: 0.06em;
        fill: #0A1624;
      }
      .nl-analytics {
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Inter", sans-serif;
        font-size: 9.5px;
        font-weight: 750;
        letter-spacing: 0.22em;
        fill: #DE4B00;
      }
      @media (prefers-color-scheme: dark) {
        .nl-navy { fill: #F8FAFC; }
        .nl-sanjai { fill: #F8FAFC; }
        .nl-orange { fill: #FF6A00; }
        .nl-analytics { fill: #FF6A00; }
      }
    </style>
  </defs>

  <!-- SA Symbol scaled to height 36px (scale ~ 0.2857) -->
  <g transform="translate(2, 4) scale(0.2857)">
